<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>Parent Information | The Little Nest Playschool</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#284c43;background:#f3f5f0}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at 12% 0%,#dcebe4,transparent 38%),linear-gradient(140deg,#faf7f0,#eff6f0)}
main{width:min(100%,480px);text-align:center}
.mark{display:grid;place-items:center;margin:0 auto 16px;width:56px;height:56px;border-radius:18px;background:#dceae0;font-size:27px}
.brand{letter-spacing:.16em;text-transform:uppercase;font-size:10px;font-weight:800;color:#5f8677}
h1{margin:12px 0 8px;color:#2d5450;letter-spacing:-.04em;font-size:26px}
p{font-size:14px;line-height:1.65;color:#63786f}
.card{background:#fffefa;border:1px solid #d6e1d9;box-shadow:0 12px 36px rgba(36,66,60,.07);border-radius:22px;padding:30px 26px;margin-top:25px}
.card h2{font-size:20px;margin:6px 0 12px;color:#25423d}
footer{font-size:11px;color:#75887d;margin-top:22px}
.spinner{width:22px;height:22px;border-radius:50%;border:3px solid #d0e0d7;border-top-color:#4b8070;margin:16px auto;animation:spin 1.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<main>
<div class="mark" aria-hidden="true">🌿</div>
<div class="brand">The Little Nest Playschool</div>
<h1>A little visit, a lovely beginning</h1>
<p>We can't wait to meet your little one.</p>
<section class="card" aria-live="polite">
<h2 id="heading">Opening your personal form…</h2>
<p id="message">Please wait a moment.</p>
<div class="spinner" id="spinner" aria-hidden="true"></div>
</section>
<footer>The Little Nest Playschool · A caring place to learn and grow.</footer>
</main>
<script>
(()=>{
'use strict';
const token=new URLSearchParams(window.location.search).get('t')||'';
if(/^[A-Za-z0-9_-]{24,160}$/.test(token)){
  const destination=new URL('https://thelittlenestplayschool.github.io/ads_journey/parent_form.html');
  destination.searchParams.set('t',token);
  window.location.replace(destination.href);
  return;
}
document.getElementById('spinner').hidden=true;
document.getElementById('heading').textContent='Your form link is missing or unavailable';
document.getElementById('message').textContent='Please ask your playschool teacher for a new personalized form link. Thank you po! ❤️';
})();
</script>
</body>
</html>
